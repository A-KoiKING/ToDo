<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- タブアイコン -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon-180x180.png"/>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>函館ロボ研ToDoアプリ</title>
  </head>
  <body>
    <noscript>このアプリを実行するにはJavaScriptを有効にする必要があります。</noscript>
    <div id="root"></div>
    
    <!-- ログイン画面 -->
    <div id="login-section">
      <h1>ログイン</h1>
      <form id="login-form">
          <input type="text" id="user-id" placeholder="ユーザーID" required>
          <input type="password" id="password" placeholder="パスワード" required>
          <button type="submit">ログイン</button>
      </form>
  </div>

  <!-- タスク管理画面 -->
  <div id="todo-section" class="hidden">
      <h1>タスク管理</h1>
      <button id="logout-button">ログアウト</button>
      <form id="task-form">
          <input type="text" id="task-input" placeholder="タスクを入力してください" required>
          <button type="submit">追加</button>
      </form>
      <ul id="task-list"></ul>
  </div>

  <!-- JavaScriptファイルの読み込み -->
  <script type="module" src="app.js"></script>
  </body>
</html>
